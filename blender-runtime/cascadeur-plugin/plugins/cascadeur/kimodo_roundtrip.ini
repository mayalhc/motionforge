; TEMPLATE ONLY - install_cascadeur_plugin.bat writes the installed copy of
; this file fresh, filling the paths in from its own location. The values
; below are left empty on purpose: a real drive letter here is a path that
; only works on the machine it was typed on, and this file is not the one
; that gets read at runtime.

[paths]
kimodo_root =
cascadeur_root =
kimodo_scene =
workspace_root = %TEMP%\KimodoEngine

[defaults]
prompt =
samples_num = 1
sample_index = 0
seed = -1
denoising_steps = 20
cfg_enabled = True
text_weight = 2.0
constraint_weight = 2.0
dataset = RP
